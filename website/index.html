<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>Aqua IoT</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main>
        <h1>Aqua IoT Monitoring System</h1>

        <section>
            <h2>Dữ liệu hiện tại</h2>

            <p>
                Nhiệt độ:
                <strong id="temperature">--</strong>
            </p>

            <p>
                pH:
                <strong id="ph">--</strong>
            </p>

            <p>
                Relay:
                <strong id="relay-status">--</strong>
            </p>

            <p>
                Thiết bị:
                <strong id="device-status">--</strong>
            </p>

            <p>
                Cập nhật:
                <strong id="updated-at">--</strong>
            </p>

            <p id="api-error"></p>
        </section>

        <section>
            <h2>Điều khiển relay</h2>

            <button id="relay-on-button" type="button">
                Bật relay
            </button>

            <button id="relay-off-button" type="button">
                Tắt relay
            </button>

            <p id="relay-message"></p>
        </section>
        <section>
            <h2>Lịch sử dữ liệu</h2>

            <label for="history-hours">
                Khoảng thời gian:
            </label>

            <select id="history-hours">
                <option value="6">6 giờ</option>
                <option value="24" selected>24 giờ</option>
                <option value="168">7 ngày</option>
                <option value="720">30 ngày</option>
            </select>

            <button id="load-history-button" type="button">
                Xem lịch sử
            </button>

            <p>
                Số bản ghi:
                <strong id="history-count">0</strong>
            </p>

            <p id="history-error"></p>

            <div class="charts-grid">
                <div class="chart-container">
                    <h3>Lịch sử nhiệt độ</h3>
                    <canvas id="temperature-chart"></canvas>
                </div>

                <div class="chart-container">
                    <h3>Lịch sử pH</h3>
                    <canvas id="ph-chart"></canvas>
                </div>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>Thời gian</th>
                        <th>Nhiệt độ</th>
                        <th>pH</th>
                        <th>Relay</th>
                    </tr>
                </thead>

                <tbody id="history-body"></tbody>
            </table>
        </section>
    <section>
    <h2>Trợ lý Aqua IoT</h2>

    <div
        id="chat-messages"
        class="chat-messages"
        aria-live="polite"
    ></div>

    <form id="chat-form">
        <label for="chat-question">
            Câu hỏi
        </label>

        <textarea
            id="chat-question"
            maxlength="500"
            rows="3"
            required
            placeholder="Ví dụ: Nhiệt độ hiện tại có bình thường không?"
        ></textarea>

        <button id="chat-send-button" type="submit">
            Gửi
        </button>
    </form>

    <p id="chat-error"></p>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
